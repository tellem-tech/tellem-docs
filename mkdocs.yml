site_name: "Документация Tellem"
site_url: "https://docs.tellem.tech"
site_description: "Документация Tellem: клиентское приложение магазина и CRM — настройка каталога, оплаты, доставки, бонусной системы и Telegram-бота."

nav:
  - Главная: index.md
  - Начало работы:
      - Подключение и первый вход: getting-started/registration.md
      - Чек-лист запуска магазина: modules/crm/getting-started.md
      - Создание Telegram-бота: getting-started/telegram-bot.md
  - CRM:
      - modules/crm/index.md
      - Заказы: modules/crm/orders.md
      - Клиенты: modules/crm/clients.md
      - Каталог:
          - modules/crm/catalog.md
          - Магазины: modules/crm/stores-and-delivery.md
          - Категории и товары: modules/crm/products-and-categories.md
          - Объединение товаров по цвету: modules/crm/product-colors.md
          - Оформление: modules/crm/main-page.md
          - Наличие и снятие с продажи: modules/crm/inventory.md
          - Импорт: modules/crm/catalog-import.md
      - Главная и аналитика: modules/crm/analytics.md
      - Сегменты: modules/crm/segments.md
      - Маркетинг:
          - modules/crm/marketing.md
          - Рассылки: modules/crm/mass-mailings.md
          - Акции и промокоды: modules/crm/promo-codes.md
          - Первый промокод: modules/crm/first-promo-code.md
          - Бесплатная доставка и сумма заказа: modules/crm/free-delivery.md
          - Бонусы: modules/crm/bonus-system.md
          - Метки: modules/crm/utm-marks.md
      - Настройки:
          - Основные: modules/crm/general-settings.md
          - Уведомления: modules/crm/crm-notifications.md
          - Оплата:
              - Оплата: modules/crm/payment-providers.md
              - Сбербанк: modules/crm/sberbank.md
          - Доставка: modules/crm/delivery.md
          - Поля заказа: modules/crm/custom-fields.md
      - Интеграции:
          - Другие интеграции: modules/crm/integrations.md
          - Telegram: getting-started/bot-setup.md
          - VK: modules/crm/vk.md
          - iiko: modules/crm/iiko.md
          - Ошибки iiko: modules/crm/iiko-errors.md
  - Клиентское приложение:
      - modules/app/index.md
      - Витрина и корзина: modules/app/ui-and-pages.md
      - Оформление и заказы: modules/app/checkout.md
      - Аккаунт и установка: modules/app/account.md
      - Уведомления покупателю: modules/app/customer-notifications.md
  - Помощь: troubleshooting.md
  - Правовые документы:
      - Все документы: legal/index.md
      - Политика обработки персональных данных: legal/personal-data-policy/index.md
      - Политика конфиденциальности: legal/privacy-policy/index.md
      - Согласие покупателя: legal/consent/index.md
      - Согласие пользователя личного кабинета: legal/account-consent/index.md
      - Согласие при отправке заявки: legal/request-consent/index.md
      - Лицензионный договор-оферта: legal/offer/index.md

theme:
  name: material
  custom_dir: overrides
  language: ru
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Тёмная тема
  font:
    text: Montserrat
    code: Roboto Mono
  favicon: media/favicon.svg
  logo: media/logo.svg

plugins:
  - search:
      lang: ru
  - i18n:
      # Our selector supports the root locale and /en/ with one shared sitemap.
      reconfigure_material: false
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: "Tellem documentation"
          site_description: "Tellem documentation: set up the customer app and CRM, catalog, payments, delivery, loyalty points, and Telegram bot."
          nav_translations:
            Главная: Home
            Начало работы: Getting started
            Подключение и первый вход: Registration and first sign-in
            Чек-лист запуска магазина: Store launch checklist
            Создание Telegram-бота: Creating a Telegram bot
            Заказы: Orders
            Клиенты: Clients
            Каталог: Catalog
            Магазины: Stores
            Категории и товары: Categories and products
            Объединение товаров по цвету: Grouping products by color
            Оформление: Design
            Наличие и снятие с продажи: Inventory and removing products from sale
            Импорт: Import
            Главная и аналитика: Dashboard and analytics
            Сегменты: Segments
            Маркетинг: Marketing
            Рассылки: Mailings
            Акции и промокоды: Promotions and promo codes
            Первый промокод: Your first promo code
            Бесплатная доставка и сумма заказа: Free delivery and order value
            Бонусы: Bonuses
            Метки: Marks
            Настройки: Settings
            Основные: General
            Уведомления: Notifications
            Оплата: Payments
            Сбербанк: Sberbank
            Доставка: Delivery
            Поля заказа: Order fields
            Интеграции: Integrations
            Другие интеграции: Other integrations
            Ошибки iiko: iiko errors
            Клиентское приложение: Customer app
            Витрина и корзина: Storefront and cart
            Оформление и заказы: Checkout and orders
            Аккаунт и установка: Account and installation
            Уведомления покупателю: Customer notifications
            Помощь: Help
            Правовые документы: Legal documents
            Все документы: All documents
            Политика обработки персональных данных: Personal Data Processing Policy
            Политика конфиденциальности: Privacy Policy
            Согласие покупателя: Buyer consent
            Согласие пользователя личного кабинета: Personal account user consent
            Согласие при отправке заявки: Request consent
            Лицензионный договор-оферта: License Agreement (Public Offer)
          theme:
            language: en
            palette:
              - media: "(prefers-color-scheme)"
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-auto
                  name: Use system theme
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-7
                  name: Light theme
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-4
                  name: Dark theme
          extra:
            social:
              - icon: fontawesome/brands/telegram
                link: https://t.me/tellem_tech_bot
                name: Support on Telegram
              - icon: fontawesome/brands/vk
                link: https://vk.link/tellem_it
                name: Tellem on VK
  - redirects:
      redirect_maps:
        # Preserve published English legal URLs after adopting language suffixes.
        legal/en/account-consent/index.md: https://docs.tellem.tech/en/legal/account-consent/
        legal/en/consent/index.md: https://docs.tellem.tech/en/legal/consent/
        legal/en/offer/index.md: https://docs.tellem.tech/en/legal/offer/
        legal/en/personal-data-policy/index.md: https://docs.tellem.tech/en/legal/personal-data-policy/
        legal/en/privacy-policy/index.md: https://docs.tellem.tech/en/legal/privacy-policy/
        legal/en/request-consent/index.md: https://docs.tellem.tech/en/legal/request-consent/
        # Страница «Создание сетки каталога» объединена с оформлением главного экрана
        modules/crm/catalog-grid.md: modules/crm/main-page.md
        # Раздел переименован: продукт больше не привязан к Telegram
        modules/mini-app/ui-and-pages.md: modules/app/ui-and-pages.md
        modules/mini-app/checkout.md: modules/app/checkout.md
        # Страницы слиты при перестройке документации (2026-10)
        useful-links.md: index.md
        modules/crm/fast-product-disable.md: modules/crm/inventory.md
        modules/crm/ozon-delivery.md: modules/crm/delivery.md
        modules/crm/new-payment-method.md: modules/crm/payment-providers.md
        modules/crm/sales.md: modules/crm/promo-codes.md
        modules/crm/pwa-and-support.md: modules/crm/general-settings.md
        modules/app/install-and-notifications.md: modules/app/account.md
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true
  # Social cards (превью при шаринге ссылок, в т.ч. в Telegram).
  # Локально выключены (нужны imaging-библиотеки); в CI включаются через env.
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
  - minify:
      minify_html: true
  - privacy
  - glightbox:
      auto_caption: true
      effect: none
      slide_effect: none

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/extra.css
  - css/home.css

extra_javascript:
  - js/accessibility.js
  - js/home.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  generator: false
  tellem_languages:
    - name: Русский
      link: /
      lang: ru
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/tellem_tech_bot
      name: Поддержка в Telegram
    - icon: fontawesome/brands/vk
      link: https://vk.link/tellem_it
      name: Tellem ВКонтакте
